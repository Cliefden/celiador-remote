name: Release

# Tag a version (v0.3.1) to publish it: checks the tag matches package.json,
# builds the VSIX, publishes it to Open VSX with trusted publishing (a
# short-lived token Open VSX issues for this workflow's OIDC identity; no
# stored token), and attaches it to a GitHub release.
#
# One-time setup: register this repository and workflow as a trusted publisher
# for the `celiador` namespace at https://open-vsx.org/user-settings/trusted-publishers.
#
# Actions are pinned to commit SHAs (the tag they were taken from is in the comment).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # Open VSX trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vsce package
      - run: npx ovsx publish --trusted-publishing ./*.vsix
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: "*.vsix"
          generate_release_notes: true
