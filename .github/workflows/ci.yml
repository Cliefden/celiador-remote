name: CI

# Typecheck, build and package the extension. On pushes to main, and on pull
# requests once they are ready for review: a draft runs nothing (`wb pr` opens
# drafts; `gh pr ready` starts the checks), and a merge train's PR runs it once
# for every PR on the train.
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft marked ready runs its checks.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
